type Post {
  id: ID!
  title: String!
  body: String!
  author: User!
  comments: [Comment!]!
}
type User {
  id: ID!
  name: String!
}
type Comment {
  id: ID!
  body: String!
  author: User!
}
type Query {
  posts: [Post!]!
  post(id: ID!): Post
  users: [User!]!
}
type Mutation {
  createPost(title: String!, body: String!, authorId: ID): Post!
  addComment(postId: ID!, body: String!): Comment!
}
